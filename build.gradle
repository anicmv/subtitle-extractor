plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.anicmv'
version = '0.0.1-SNAPSHOT'
description = 'subtitle-extractor'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext['lombok.version'] = '1.18.48'
ext['log4j2.version'] = '2.26.1'

// 日志后端切换为 Log4j2：排除 Boot 默认的 Logback 桥接栈，避免循环桥接。
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://jitpack.io')
        content { includeGroup 'com.github.caseyscarborough' }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'com.xuxueli:xxl-job-core:3.4.2'
    implementation 'com.github.caseyscarborough:subtitler:2.0.0'
    implementation 'com.github.houbb:opencc4j:1.14.0'
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.17'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
