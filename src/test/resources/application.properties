# 默认测试不访问用户数据库，也不调用真实模型。
# 覆盖主配置默认的 dev profile，避免加载 gitignore 掉的 application-dev.yaml。
spring.profiles.active=test
# 占位密钥：测试不访问真实模型，这里只为满足自动配置的凭据校验。
spring.ai.openai.api-key=test-key
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/subtitle-h2.sql
spring.sql.init.continue-on-error=false
spring.datasource.generate-unique-name=true
